<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SME Connect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <header>
    <h1>SME Connect</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" class="btn-primary">Login</a></li>
        <li><button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme"><i class="fas fa-sun"></i></button></li>
      </ul>
    </nav>
  </header>

  <div class="signup-container">
    <div class="form-box">
      <h2 id="register-title">Create Account</h2>
      <p>Fill in your details to get started</p>
      
      <form id="registerForm">
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="Enter your full name">
        </div>

        <div class="input-group">
          <label for="profilePic">Profile Picture (Optional)</label>
          <input type="file" id="profilePic" accept="image/*" style="width: 100%; padding: 10px; background: var(--bg-light); color: var(--text-color); border-radius: 8px;">
        </div>

        <!-- Seller Specific Fields (Hidden by default) -->
        <div id="seller-fields" style="display: none;">
          <div class="input-group">
            <label for="businessName">Business Name</label>
            <input type="text" id="businessName" placeholder="Enter your business name">
          </div>
          <div class="input-group">
            <label for="businessType">Business Type</label>
            <select id="businessType" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--bg-light); color: var(--text-color); outline: none;">
              <option value="">Select Business Category</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Services">Services</option>
              <option value="Home & Living">Home & Living</option>
              <option value="Health & Beauty">Health & Beauty</option>
              <option value="Agriculture">Agriculture</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="input-group">
            <label for="location">Location / Address</label>
            <input type="text" id="location" placeholder="City, Province (e.g., Lusaka)">
          </div>
          <div class="input-group">
            <label for="businessDocs">Business Documents (PDF/Image)</label>
            <input type="file" id="businessDocs" accept=".pdf,.jpg,.jpeg,.png" style="width: 100%; padding: 10px; background: var(--bg-light); color: var(--text-color); border-radius: 8px;">
            <small style="color: #888;">Upload Business License or ID for verification.</small>
          </div>
          <div class="input-group">
            <label for="businessDesc">Business Description (Optional)</label>
            <textarea id="businessDesc" placeholder="Tell customers about your business..." style="width: 100%; padding: 12px; background: var(--bg-light); color: var(--text-color); border-radius: 8px; border:none; resize: vertical; min-height: 80px;"></textarea>
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Create a password (min 6 chars)">
        </div>

        <!-- Hidden input to store role (customer/seller) -->
        <input type="hidden" id="role" value="customer">

        <button type="submit" class="btn-primary">Register</button>
        
        <div class="divider">OR</div>

        <button type="button" class="btn-google" onclick="loginWithGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" width="18">
          Continue with Google
        </button>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
