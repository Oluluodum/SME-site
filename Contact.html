<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | SME Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <header>
    <h1>SME<span id="admin-trigger" style="cursor: default;"> </span>Connect</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sellers.html">Sellers</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="Contact.html" class="active">Contact</a></li>
        <li><a href="signup.html">Sign Up</a></li>
        <li><a href="login.html">Login</a></li>
        <li><button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme"><i class="fas fa-sun"></i></button></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="contact-section">
    <h2>Contact Us</h2>
    <p>Have questions or feedback? We'd love to hear from you!</p>

    <section class="contact-container">
      <!-- Contact Form -->
      <aside class="contact-form">
        <form id="contactForm" action="#" method="POST">
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required />
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>

          <div class="input-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Enter subject" required />
          </div>

          <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Type your message here..." required></textarea>
          </div>

          <button type="submit" class="btn-primary">Send Message</button>
        </form>
      </aside>

      <!-- Contact Info -->
      <section class="contact-info">
        <h3>Get in Touch</h3>
        <p>Email: support@smeconnect.com</p>
        <p>Phone: +260 771 9160 40</p>
        <p>Address: Kalewa Rd, Ndola, Zambia</p>
      </section>
    </section>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 SME Connect. All rights reserved.</p>
    <div class="social-icons">
      <a href="#" title="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
