<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - SME Connect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>SME Connect</h1>
    <button class="mobile-nav-toggle" aria-label="Toggle Navigation"><i class="fas fa-bars"></i></button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" class="btn-primary">Login</a></li>
        <li><button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme"><i class="fas fa-sun"></i></button></li>
      </ul>
    </nav>
  </header>

  <div class="login-container">
    <div class="form-box">
      <h2>Reset Password</h2>
      <p>Please enter your new password below.</p>
      
      <form id="changePasswordForm">
        <div class="input-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required placeholder="Enter new password (min 6 chars)" minlength="6">
        </div>
        
        <button type="submit" class="btn-primary">Update Password</button>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
