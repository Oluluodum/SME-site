<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SME Connect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>SME Connect</h1>
    <button class="mobile-nav-toggle" aria-label="Toggle Navigation"><i class="fas fa-bars"></i></button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="signup.html" class="btn-primary">Sign Up</a></li>
        <li><button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme"><i class="fas fa-sun"></i></button></li>
      </ul>
    </nav>
  </header>

  <div class="login-container">
    <div class="form-box">
      <h2>Welcome Back</h2>
      <p>Login to access your dashboard</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>

        <div class="checkbox">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
          <a href="#" id="forgotPasswordLink" style="margin-left: auto;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 SME Connect. All rights reserved.</p>
    <p style="font-size: 12px; margin-top: 10px;"><a href="#" id="admin-link" style="color: #555; text-decoration: none;">Admin Access</a></p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
